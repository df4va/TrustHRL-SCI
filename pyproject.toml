[build-system]
requires = ["setuptools==68.2.2", "wheel==0.41.3"]
build-backend = "setuptools.build_meta"

[project]
name = "trusthrl-sci"
version = "0.1.0"
description = "Hierarchical constrained control of post-injury cytokine dynamics"
readme = "README.md"
requires-python = "==3.10.*"
license = {file = "LICENSE"}
dependencies = [
  "torch==2.1.2",
  "numpy==1.26.2",
  "scipy==1.11.4",
  "pandas==2.1.4",
  "scikit-learn==1.3.2",
  "PyYAML==6.0.1",
  "requests==2.31.0",
]

[project.scripts]
trusthrl-calibrate = "trusthrl_sci.entrypoints.calibrate:main"
trusthrl-train = "trusthrl_sci.entrypoints.train:main"
trusthrl-evaluate = "trusthrl_sci.entrypoints.evaluate:main"

[tool.setuptools.packages.find]
include = ["trusthrl_sci*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["trusthrl_sci"]

